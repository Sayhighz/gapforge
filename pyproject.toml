[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gapforge"
version = "0.1.0"
description = "Evidence-backed business-gap research harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
gap = "gapforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gapforge"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=gapforge --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL test database"]

[tool.coverage.run]
branch = true
source = ["gapforge"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["gapforge"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
